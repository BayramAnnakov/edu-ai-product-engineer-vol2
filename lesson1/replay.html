<script>
const data=JSON.parse(document.querySelector('#examples').textContent);let page=0,step=0;const notes={};
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const questions=['Can this work disappear?','What did the provider reuse?','Can a typed answer be wrong?','Did the whole job improve?','What will you test in your workflow?'];
const scope='<p class="scope">Actual traces: recorded provider calls on synthetic cases or public documentation, sanitized. Practice projects: authored fixtures. This offline replay makes no model calls and sends no data.</p>';
const dollars=n=>'$'+n.toFixed(7);const panel=(h,b)=>'<section class="card"><h2>'+h+'</h2>'+b+'</section>';
function body(){
 if(page===0)return '<p>Predict which work can become code before changing a prompt or model.</p>'+(step>=1?panel('A bounded predicate','<p>Same account + authoritative active competitor contract + current term + no conflict → the account can be excluded by a rule.</p>'):'')+(step>=2?panel('The rejecting boundary','<p>Expired, missing, mismatched or conflicting evidence → abstain and use another path. A budget freeze is a different decision.</p>'):'')+(step>=3?panel('Count what actually disappeared','<p>One scorer call disappears when the rule applies. Source records already fetched still cost time. This is a teaching schematic, not another measured provider run.</p>'):'');
 if(page===1){let rows=data.cache;let changing=rows.filter(x=>x.condition.startsWith('changing')).reduce((a,r)=>a+r.cost_usd,0),stable=rows.filter(x=>x.condition.startsWith('stable')).reduce((a,r)=>a+r.cost_usd,0);return '<p>A timestamp changes before a repeated long prefix. Predict the second request’s cache reads, cost and latency.</p>'+(step>=1?panel('Actual read/write counters','<div class="scroll"><table><tr><th>Condition</th><th>Read</th><th>Write</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.condition)+'</td><td>'+r.usage.input_tokens_details.cached_tokens+'</td><td>'+r.usage.input_tokens_details.cache_write_tokens+'</td></tr>').join('')+'</table></div>'):'')+(step>=2?panel('Compare complete pairs','<p>Changing prefix: '+dollars(changing)+'; stable cold + warm: '+dollars(stable)+'. '+((1-stable/changing)*100).toFixed(2)+'% lower in this one pair, including writes.</p>'):'')+(step>=3?panel('Cheaper need not mean faster','<p>Stable cold: '+rows[2].latency_seconds.toFixed(2)+'s; warm: '+rows[3].latency_seconds.toFixed(2)+'s. No speedup observed. Historical usage prices, not invoices. The shorter scorer below has zero cache reads/writes.</p><a href="traces/cache-pair.jsonl">Inspect the sanitized receipts</a>'):'');}
 if(page===2)return '<p>Inspect a selected real error, not a population error-rate estimate.</p>'+(step>=1?panel('Same visible contract','<p>Example Company: B2B SaaS, 24 employees and 4 sales staff. Minimum: 50 employees and 10 sales staff. Verified below-minimum → score 1 / not_icp.</p>'):'')+(step>=2?'<div class="grid">'+data.score.map(r=>panel(esc(r.model),'<pre>'+esc(JSON.stringify(r.output,null,2))+'</pre>')).join('')+'</div>':'')+(step>=3?panel('Validity, correctness and economics','<p class="bad">Jev returned score 3 while citing a real supplied record. JSON and citation validity do not establish task correctness.</p><p>'+data.score.map(r=>esc(r.model)+': '+dollars(r.cost_usd)+', '+r.latency_seconds.toFixed(3)+'s').join(' · ')+'</p><p>Jev used seven Choice questions in one paid request. It has no effort knob here. What would this error do downstream, and what is that harm worth?</p><a href="traces/scoring-boundary.jsonl">Inspect both sanitized receipts</a>'):'');
 if(page===3)return '<p>Compare task quality, then economics, then the complete job.</p>'+(step>=1?panel('A faster step','<p>A separate historical scoring episode improved scoring time, then fetching became the bottleneck. It is not the after-period of the page-precheck case. Reprofile the whole job.</p>'):'')+(step>=2?panel('Price the errors','<p>Saving about four cents across 30 workshop cases alongside two extra wrong decisions does not price the business harm. Inspect both error directions and review/rework.</p>'):'')+(step>=3?panel('Two distinct records','<p><a href="https://t.me/ProductsAndStartups/1844">Post 1844</a> reports a failed quality test alongside an owner’s decision to accept a speed/cost trade-off. The failed test stays failed. A proposed trial needs owner, value/error cost, exposure cap, rollback and checkpoint; the proposal authorizes no deployment.</p>'):'');
 return '<p>Write an unexecuted plan now; attach real evidence after testing. The download stays on your computer.</p>'+(step>=1?panel('Define accepted work','<label>Your workflow<input id="workflow" value="'+esc(notes.workflow)+'"></label><label>Correct result and costly error directions<textarea id="contract">'+esc(notes.contract)+'</textarea></label>'):'')+(step>=2?panel('One bounded experiment','<label>One lever and why<textarea id="lever">'+esc(notes.lever)+'</textarea></label><label>Quality floor, budget and frozen cases<textarea id="limits">'+esc(notes.limits)+'</textarea></label>'):'')+(step>=3?panel('Take the method into your project','<p>Use the bakeoff skill with your implementation and evidence. Stop a failed dev candidate, or freeze before evaluating. Keep gate verdict and owner decision separate.</p><button id="download">Download my experiment plan</button><p id="download-status" role="status"></p><p><a href="worksheet.md">Worksheet</a> · <a href="../skills/bakeoff/SKILL.md">Skill</a> · <a href="homework.md">One homework artifact</a></p>'):'');
}
function remember(){for(const key of ['workflow','contract','lever','limits'])if($('#'+key))notes[key]=$('#'+key).value;}
function render(){ $('#lesson').innerHTML='<div class="meta">QUESTION '+(page+1)+' / 5 · '+step+' / 3 REVEALS</div><h1>'+questions[page]+'</h1>'+scope+body();$('#progress').textContent=(page+1)+' / 5';$('#back').disabled=page===0;$('#next').disabled=step<3||page===4;$('#reveal').disabled=step===3;if($('#download'))$('#download').onclick=()=>{remember();if(!notes.workflow||!notes.lever){$('#download-status').textContent='Write your workflow and one lever first.';return;}const text='# My bakeoff experiment plan\n\nEvidence: unexecuted proposal. No result or deployment is claimed.\n\n'+Object.entries(notes).map(([k,v])=>'## '+k+'\n'+v).join('\n\n')+'\n';const url=URL.createObjectURL(new Blob([text],{type:'text/markdown'})),a=document.createElement('a');a.href=url;a.download='my-bakeoff-plan.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#download-status').textContent='Plan prepared for download.';};}
$('#reveal').onclick=()=>{remember();step=Math.min(3,step+1);render();};$('#next').onclick=()=>{remember();page++;step=0;render();window.scrollTo(0,0);};$('#back').onclick=()=>{remember();page--;step=0;render();};$('#reset').onclick=()=>{remember();page=0;step=0;render();};render();
</script></html>
