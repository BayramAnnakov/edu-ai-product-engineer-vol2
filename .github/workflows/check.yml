name: Student kit checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s lesson1/recorded-starter/tests -v
      - run: python scripts/check_bundle.py
      - run: python scripts/inspect_traces.py
