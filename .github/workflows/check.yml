name: Student kit checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s lesson1/recorded-starter/tests -v
      - run: python scripts/check_bundle.py
      - run: python scripts/inspect_traces.py
      - run: python lesson2/retrieval.py join dynamic --brief > /dev/null && python lesson2/retrieval.py discover programmatic --corpus lesson2/records-large.json --brief > /dev/null
